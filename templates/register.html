<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register - The Mart</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#FF8F9C20 0%,#FF8F9C10 100%);min-height:100vh;display:flex;justify-content:center;align-items:center}
.register-container{background:white;padding:40px;border-radius:20px;width:100%;max-width:450px;box-shadow:0 20px 40px rgba(0,0,0,0.1)}h2{text-align:center;margin-bottom:30px;color:#484848}
.form-group{margin-bottom:20px}.form-group input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-family:'Poppins',sans-serif}
.btn{width:100%;padding:12px;background:#FF8F9C;color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
.btn:hover{background:#e07a87}.link{text-align:center;margin-top:20px}.link a{color:#FF8F9C;text-decoration:none}
.alert{padding:10px;border-radius:8px;margin-bottom:20px}.alert-success{background:#d4edda;color:#155724}.alert-danger{background:#f8d7da;color:#721c24}
</style></head>
<body>
<div class="register-container"><h2>Create Account</h2>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="POST"><div class="form-group"><input type="text" name="name" placeholder="Full Name" required></div>
<div class="form-group"><input type="email" name="email" placeholder="Email Address" required></div>
<div class="form-group"><input type="tel" name="phone" placeholder="Phone Number"></div>
<div class="form-group"><input type="password" name="password" placeholder="Password" required></div>
<button type="submit" class="btn">Register</button></form>
<div class="link">Already have an account? <a href="/login">Login here</a></div></div>
</body></html>
