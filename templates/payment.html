<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Payment - The Mart</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Poppins',sans-serif;background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh}
.payment-container{max-width:500px;width:100%;background:white;padding:30px;border-radius:15px;text-align:center}
.order-summary{background:#f9f9f9;padding:20px;border-radius:10px;margin:20px 0;text-align:left}
.order-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
.total{border-top:2px solid #FF8F9C;padding-top:15px;font-weight:700}
.btn{width:100%;padding:15px;background:#FF8F9C;color:white;border:none;border-radius:8px;font-size:18px;font-weight:600;cursor:pointer}
</style></head>
<body><div class="payment-container"><h2>Complete Payment</h2><div class="order-summary"><h3>Order Summary</h3>
{% for item in cart_items %}<div class="order-item"><span>{{ item.product.name }} x {{ item.quantity }}</span><span>${{ "%.2f"|format(item.product.price * item.quantity) }}</span></div>{% endfor %}
<div class="order-item total"><span>Total</span><span>${{ "%.2f"|format(total) }}</span></div></div>
<button class="btn" onclick="payNow()">Pay Now</button></div>
<script>function payNow(){var options={key:"{{ razorpay_key }}",amount:{{ total * 100 }},currency:"INR",name:"The Mart",order_id:"{{ order.razorpay_order_id }}",handler:function(response){fetch('/payment-success',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({razorpay_payment_id:response.razorpay_payment_id,razorpay_order_id:response.razorpay_order_id,razorpay_signature:response.razorpay_signature})}).then(res=>res.json()).then(data=>{if(data.success)window.location.href='/order-success/'+data.order_id;else alert('Payment failed!');})},theme:{color:"#FF8F9C"}};var rzp=new Razorpay(options);rzp.open();}</script>
</body></html>
