{% extends "base.html" %}
{% block title %}Order Success - The Mart{% endblock %}
{% block content %}
<div style="max-width: 600px; margin: 80px auto; background: white; padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.1);">
    <i class="fas fa-check-circle" style="font-size: 80px; color: #4CAF50; margin-bottom: 20px;"></i>
    <h2>Order Confirmed!</h2>
    <p>Order ID: {{ order.order_id }}</p>
    <p>Total: ${{ "%.2f"|format(order.total_amount) }}</p>
    <a href="/" style="display: inline-block; padding: 12px 30px; background: #FF8F9C; color: white; text-decoration: none; border-radius: 8px; margin-top: 20px;">Continue Shopping</a>
</div>
{% endblock %}
