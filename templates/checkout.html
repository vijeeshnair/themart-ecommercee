<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout - The Mart</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Poppins',sans-serif;background:#f5f5f5}.container{max-width:1000px;margin:40px auto;background:white;padding:30px;border-radius:15px}
.two-columns{display:grid;grid-template-columns:1fr 1fr;gap:30px}.order-summary{background:#f9f9f9;padding:20px;border-radius:10px}
.order-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.total{border-top:2px solid #FF8F9C;padding-top:15px;font-weight:700}
.form-group{margin-bottom:15px}.form-group input,.form-group textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-family:'Poppins',sans-serif}
.btn{width:100%;padding:12px;background:#FF8F9C;color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
@media(max-width:768px){.two-columns{grid-template-columns:1fr}}
</style></head>
<body><div class="container"><h2>Checkout</h2><div class="two-columns"><div class="order-summary"><h3>Order Summary</h3>
{% for item in cart_items %}<div class="order-item"><span>{{ item.product.name }} x {{ item.quantity }}</span><span>${{ "%.2f"|format(item.product.price * item.quantity) }}</span></div>{% endfor %}
<div class="order-item total"><span>Total</span><span>${{ "%.2f"|format(total) }}</span></div></div>
<div><h3>Shipping Details</h3><form method="POST"><div class="form-group"><input type="text" name="name" placeholder="Full Name" value="{{ user.name }}" required></div>
<div class="form-group"><input type="email" name="email" placeholder="Email" value="{{ user.email }}" required></div>
<div class="form-group"><input type="tel" name="phone" placeholder="Phone" value="{{ user.phone }}" required></div>
<div class="form-group"><textarea name="address" placeholder="Address" rows="3" required></textarea></div>
<div class="form-group"><input type="text" name="city" placeholder="City" required></div>
<div class="form-group"><input type="text" name="state" placeholder="State" required></div>
<div class="form-group"><input type="text" name="pincode" placeholder="Pincode" required></div>
<button type="submit" class="btn">Place Order</button></form></div></div></div>
</body></html>
